{% extends "base.html" %}
{% load static %}

{% block page_header %}
<div class="container header-container">
    <div class="row">
        <div class="col"></div>
    </div>
</div>
{% endblock page_header %}

{% block content %}
<div class="container h-100">
    <div class="row h-100">
        <div class="col-7 col-md-6 my-auto">
            <h1 class="display-4 logo-font px-3 py-2 hero-title">
                The New Drop Is here!
            </h1>
            <div class="my-5">
                <h4>
                    <a
                        href="{% url 'products' %}"
                        class="shop-now-button btn btn-lg rounded-0 text-uppercase py-3"
                    >Shop Now!</a>
                </h4>
            </div>
        </div>
    </div>
</div>

<!-- Mailchimp Newsletter Signup Form -->
<div id="mc_embed_shell" class="mt-5 mb-5">
    <link href="//cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">
    <style type="text/css">
        #mc_embed_signup {
            background: #fff;
            clear: left;
            font: 14px Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: auto;
        }
    </style>
    <div id="mc_embed_signup">
        <form action="https://herokuapp.us6.list-manage.com/subscribe/post?u=816562a9931bdf9987f83b197&amp;id=613669a5b0&amp;f_id=001035e3f0"
              method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form"
              class="validate" target="_blank">
            <div id="mc_embed_signup_scroll">
                <h2>Subscribe to our newsletter</h2>
                <div class="indicates-required"><span class="asterisk">*</span> indicates required</div>
                <div class="mc-field-group">
                    <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
                    <input type="email" name="EMAIL" class="required email form-control" id="mce-EMAIL" required>
                </div>
                <div class="mc-field-group">
                    <label for="mce-FNAME">First Name </label>
                    <input type="text" name="FNAME" class="form-control" id="mce-FNAME">
                </div>
                <div class="mc-field-group">
                    <label for="mce-LNAME">Last Name </label>
                    <input type="text" name="LNAME" class="form-control" id="mce-LNAME">
                </div>
                <div id="mce-responses" class="clear">
                    <div class="response" id="mce-error-response" style="display:none"></div>
                    <div class="response" id="mce-success-response" style="display:none"></div>
                </div>
                <div aria-hidden="true" style="position:absolute; left:-5000px;">
                    <input type="text" name="b_816562a9931bdf9987f83b197_613669a5b0" tabindex="-1" value="">
                </div>
                <div class="clear mt-3">
                    <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="btn btn-black rounded-0" value="Subscribe">
                </div>
            </div>
        </form>
    </div>
    <script type="text/javascript" src="//s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
    <script type="text/javascript">
        (function ($) {
            window.fnames = new Array();
            window.ftypes = new Array();
            fnames[0] = 'EMAIL';
            ftypes[0] = 'email';
            fnames[1] = 'FNAME';
            ftypes[1] = 'text';
            fnames[2] = 'LNAME';
            ftypes[2] = 'text';
        })(jQuery);
        var $mcj = jQuery.noConflict(true);
    </script>
</div>
{% endblock content %}
