<div class="border rounded p-3 mb-3 bg-light">
  <div class="d-flex justify-content-between">
    <strong class="text-dark">{{ r.title }}</strong>
    <div class="text-warning small">
      {{ "★"|repeat:r.rating }}{{ "☆"|repeat:5|slice:":-r.rating" }}
    </div>
  </div>

  <small class="text-muted d-block mb-2">
    by {{ r.user.get_full_name|default:r.user.username }}
    • {{ r.created_at|date:"M d, Y" }}
  </small>

  <p class="mb-1 text-break">{{ r.content|linebreaksbr }}</p>

  {% if user == r.user or user.is_superuser %}
    <div class="text-end">
      <a href="{% url 'edit_review' r.pk %}" class="btn btn-sm btn-outline-primary me-2">
        Edit
      </a>
      <a href="{% url 'delete_review' r.pk %}" class="btn btn-sm btn-outline-danger">
        Delete
      </a>
    </div>
  {% endif %}
</div>
