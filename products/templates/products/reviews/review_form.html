{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
  <h3 class="mb-4">
    {% if object %}Edit Review{% else %}New Review{% endif %}
  </h3>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}

    <button class="btn btn-black rounded-0">Save</button>

    <a href="{{ object.product.get_absolute_url }}" class="btn btn-outline-secondary rounded-0">
    Cancel
</a>

  </form>
</div>
{% endblock %}
