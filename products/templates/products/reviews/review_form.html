{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block page_header %}
    <div class="container header-container">
        <div class="row">
            <div class="col"></div>
        </div>
    </div>
{% endblock %}

{% block content %}
<div class="overlay"></div>
<div class="container">
    <div class="row">
        <div class="col-12 col-md-6 offset-md-3">
            <hr>
            <h2 class="logo-font mb-4">
                {% if object %}Edit Review{% else %}Write a Review{% endif %}
            </h2>
            <hr>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-6 offset-md-3">
            <form method="post" class="mt-3">
                {% csrf_token %}
                {{ form|crispy }}
                
                <div class="text-right mt-4">
                    <a href="{% if object %}{{ object.product.get_absolute_url }}{% else %}{% url 'products' %}{% endif %}" 
                       class="btn btn-outline-black rounded-0 mr-2">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-black rounded-0">
                        {% if object %}Update Review{% else %}Save Review{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
