{% extends "base.html" %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet"
        href="{% static 'products/css/reviews.css' %}">
{% endblock %}

{% block page_header %}
  <div class="container header-container"><div class="row"><div class="col"></div></div></div>
{% endblock %}


{% block content %}
<div class="overlay"></div>
<div class="review-delete-container">
  <div class="review-delete-wrapper">
    <h2 class="h4 mb-3">Delete review?</h2>
    <p class="mb-4">This action cannot be undone.</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger mr-2">Yes, delete</button>
      <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
