{% extends "base.html" %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet"
        href="{% static 'products/css/reviews.css' %}">
{% endblock %}

{% block body_class %}no-hero{% endblock %} 

{% block content %}
<div class="review-delete-wrapper">
  <h2 class="h4 mb-3">Delete review?</h2>
  <p class="mb-4">This action cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger mr-2">Yes, delete</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
  document.body.classList.add('no-hero');
</script>
{% endblock extra_js %}
